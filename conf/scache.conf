# Per-node deployment template for the real-URMA backend.
# Set the master address, local URMA device, advertised management address,
# pool sizes, and node-local paths before starting a multi-node deployment.

scache.master.ip=127.0.0.1
scache.master.port=16388
scache.client.port=15678
scache.cores=2
scache.memory.offHeap.size=1024m
scache.block.fetching.retry=1
scache.rpc.askTimeout=60s
scache.rpc.lookupTimeout=60s
scache.rpc.numRetries=1
scache.rpc.retry.wait=100ms

scache.storage.network.enabled=true
scache.blockTransfer.backend=ub
scache.ub.transport=real
spark.urma.strict=true
spark.urma.device=REPLACE_WITH_URMA_DEVICE
spark.urma.controlBindHost=0.0.0.0
spark.urma.controlAdvertiseHost=REPLACE_WITH_NODE_MANAGEMENT_IP
spark.urma.queueDepth=128
spark.urma.chunkSize=10485760
spark.urma.transferTimeoutMs=60000
spark.urma.arenaBytes=67108864
spark.urma.arenaCount=2

# Node-local mmap bridge between the Spark-side daemon and SCache.
scache.daemon.ipc.backend=pool
scache.daemon.ipc.prepare=true
scache.daemon.ipc.pool.path=/dev/shm/scache-ipc.pool
scache.daemon.ipc.pool.size=2g
scache.daemon.ipc.pool.mapChunk=256m
scache.daemon.ipc.pool.align=4096
scache.daemon.ipc.pool.zeroCopy.put=true
scache.daemon.ipc.dir.local=/dev/shm/scache-ipc-files/put
scache.daemon.ipc.dir.remote=/dev/shm/scache-ipc-files/put
scache.daemon.ipc.dir.get=/dev/shm/scache-ipc-files/get
scache.daemon.putBlock.async=false

# Long-lived registered URMA arenas. This path is node-local, not shared
# between hosts and not used to carry cross-node payload.
scache.ub.pool.enabled=true
scache.ub.pool.path=/dev/shm/scache-ub-pool
scache.ub.pool.forceOnCommit=false
scache.ub.checksum.enabled=false

# The CXL/remote-NUMA experimental backend is not part of real UB deployment.
scache.storage.cxl.shared.enabled=false
scache.storage.cxl.shared.force=false
